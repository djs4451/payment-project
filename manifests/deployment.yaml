apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-app
  namespace: payment-lab
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-app
  template:
    metadata:
      labels:
        app: payment-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: payment-config
                  key: APP_ENV
          volumeMounts:
            - name: payment-html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: payment-html
          configMap:
            name: payment-config
