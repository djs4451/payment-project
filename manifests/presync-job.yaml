
apiVersion: batch/v1
kind: Job
metadata:
  name: payment-presync-validation
  namespace: payment-lab
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: validation
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Starting payment deployment validation"
              echo "Checking deployment prerequisites"
              echo "Validation successful"
      restartPolicy: Never

