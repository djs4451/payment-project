apiVersion: batch/v1
kind: Job
metadata:
  name: payment-syncfail-handler
  namespace: payment-lab
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
spec:
  backoffLimit: 0
  template:
    spec:
      containers:
        - name: failure-handler
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Payment application synchronization failed"
              echo "Executing failure handling procedure"
              echo "Failure notification simulation completed"
      restartPolicy: Never
